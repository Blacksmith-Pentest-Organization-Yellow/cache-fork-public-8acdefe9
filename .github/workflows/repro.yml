name: Repro Fork Scope Cache
on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [save, restore]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: blacksmith-staging-2vcpu-ubuntu-2404
    steps:
      - name: Write harmless base-branch marker
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'save' && github.ref_name == 'repro-canary-a3afca'
        run: |
          mkdir -p '/tmp/bs-repro-repro-fork-key-dd0c8a9d1c29'
          printf '%s\n' 'REPRO_BASE_e60b3bb1c83b4d4cf3' > '/tmp/bs-repro-repro-fork-key-dd0c8a9d1c29/marker'
      - name: Save base-branch cache
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'save' && github.ref_name == 'repro-canary-a3afca'
        uses: actions/cache/save@v4
        with:
          path: /tmp/bs-repro-repro-fork-key-dd0c8a9d1c29
          key: repro-fork-key-dd0c8a9d1c29
      - name: Restore exact-key cache
        if: github.event_name == 'pull_request' || github.event.inputs.operation == 'restore'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bs-repro-repro-fork-key-dd0c8a9d1c29
          key: repro-fork-key-dd0c8a9d1c29
      - name: Report safe result
        if: github.event_name == 'pull_request' || github.event.inputs.operation == 'restore'
        run: |
          echo 'CACHE_HIT=${{ steps.cache.outputs.cache-hit }}'
          if test -f '/tmp/bs-repro-repro-fork-key-dd0c8a9d1c29/marker'; then cat '/tmp/bs-repro-repro-fork-key-dd0c8a9d1c29/marker'; else echo 'CACHE_MISS'; fi
      - name: Checkout contributor PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - name: Run contributor test script
        if: github.event_name == 'pull_request'
        run: bash contributor-proof.sh
