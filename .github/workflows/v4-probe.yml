name: Fork Cache Validation Four
on:
  workflow_dispatch:
    inputs:
      operation:
        description: save or restore test marker
        required: true
        type: choice
        default: restore
        options: [save, restore]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: blacksmith-staging-2vcpu-ubuntu-2404
    steps:
      - name: Write base marker
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'save' && github.ref_name == 'v4-canary-f5f36e'
        run: |
          mkdir -p '/tmp/v4-v4-cache-7c4283209d2f00'
          printf '%s\n' 'V4_CANARY_5cac547bf13a57ec69b2' > '/tmp/v4-v4-cache-7c4283209d2f00/marker'
      - name: Save base cache
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'save' && github.ref_name == 'v4-canary-f5f36e'
        uses: actions/cache/save@v4
        with:
          path: /tmp/v4-v4-cache-7c4283209d2f00
          key: v4-cache-7c4283209d2f00
      - name: Restore exact key
        if: github.event_name == 'pull_request' || github.event.inputs.operation == 'restore'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/v4-v4-cache-7c4283209d2f00
          key: v4-cache-7c4283209d2f00
      - name: Report marker
        if: github.event_name == 'pull_request' || github.event.inputs.operation == 'restore'
        run: |
          echo 'CACHE_HIT=${{ steps.cache.outputs.cache-hit }}'
          if test -f '/tmp/v4-v4-cache-7c4283209d2f00/marker'; then cat '/tmp/v4-v4-cache-7c4283209d2f00/marker'; else echo 'CACHE_MISS'; fi
      - name: Checkout PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - name: Run contributor script
        if: github.event_name == 'pull_request'
        run: if test -f contributor-proof.sh; then bash contributor-proof.sh; else echo NO_CONTRIBUTOR_SCRIPT; fi
